name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref so only the latest commit's CI runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job names are the required checks on master ("Unit tests", "Build").
  # New checks go in as steps of these jobs, so the branch protection needs no
  # change.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - run: npm test
      # Reports known vulnerabilities in the production dependencies without
      # failing the run: fixing them is a dependency update of its own.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Workers bundle, as Workers Builds makes it for production:
      # WORKERS_CI makes Nitro use the cloudflare-module preset and NuxtHub the
      # D1 driver. Without a SENTRY_AUTH_TOKEN the Sentry plugin only skips the
      # source map upload.
      - name: Build the Worker
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          grep -q 'hub:db using sqlite database with d1 driver' build.log \
            || { echo '::error::The build did not use the D1 driver.'; exit 1; }
          test -f .output/server/wrangler.json \
            || { echo '::error::The build made no wrangler.json.'; exit 1; }
        env:
          WORKERS_CI: 1
          # Nuxt's production build needs more than Node's default heap for this app.
          NODE_OPTIONS: --max-old-space-size=6144
